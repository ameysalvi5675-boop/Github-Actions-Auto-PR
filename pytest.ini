[pytest]
# ============================================================================
# Pytest Configuration for Feature Flag Manager
# Used by GitHub Actions CI/CD pipeline
# ============================================================================

# Test discovery
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# Directory structure
testpaths = tests
addopts =
    # Verbose output
    -v
    # Show local variables on failure
    -l
    # Show summary of all test outcomes
    -ra
    # Coverage
    --cov=src/feature_flags
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    # Markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Parallelization
    -n auto
    # Timeout
    --timeout=300

# Markers for organizing tests
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require external services)
    e2e: End-to-end tests
    slow: Slow running tests
    security: Security-related tests
    compliance: Compliance/audit tests
    smoke: Smoke tests (quick sanity checks)

# Asyncio mode
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = src/feature_flags
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov
