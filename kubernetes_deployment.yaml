# ============================================================================
# Kubernetes Deployment Manifests for Feature Flag Manager
# Used by GitHub Actions CD pipeline for automated deployment
# ============================================================================

---
# Development Environment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  namespace: dev
  labels:
    app: feature-flags
    environment: development
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: feature-flags
      environment: development
  template:
    metadata:
      labels:
        app: feature-flags
        environment: development
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: feature-flags
      imagePullSecrets:
        - name: ghcr-cred
      containers:
      - name: feature-flags
        image: nginx:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP

      # Volumes removed for nginx compatibility

      # Node affinity (optional - for specific node pools)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: workload-type
                operator: In
                values:
                - application

---
# Service (Load Balancer)
apiVersion: v1
kind: Service
metadata:
  name: feature-flags
  namespace: dev
  labels:
    app: feature-flags
    environment: development
spec:
  type: LoadBalancer
  selector:
    app: feature-flags
    environment: development
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: feature-flags
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: feature-flags
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-flags
  namespace: dev

---
# Role for pod operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feature-flags
  namespace: dev
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feature-flags
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: feature-flags
subjects:
- kind: ServiceAccount
  name: feature-flags
  namespace: dev

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-config
  namespace: dev
data:
  app.yaml: |
    feature_flags:
      cache_ttl: 300
      audit_retention_days: 90
      max_rollout_percentage: 100

    security:
      enable_api_key_auth: true
      require_https: false  # In dev environment
      cors_origins:
        - "http://localhost:3000"
        - "http://localhost:8000"

---
# Production Environment - Deployment (Blue)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags-blue
  namespace: production
  labels:
    app: feature-flags
    environment: production
    deployment: feature-flags-blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: feature-flags
      deployment: feature-flags-blue
  template:
    metadata:
      labels:
        app: feature-flags
        deployment: feature-flags-blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: feature-flags
      imagePullSecrets:
        - name: ghcr-cred
      containers:
      - name: feature-flags
        image: nginx:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP

      # Volumes removed for nginx compatibility

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - feature-flags
              topologyKey: kubernetes.io/hostname

---
# Production Service (Load Balancer)
apiVersion: v1
kind: Service
metadata:
  name: feature-flags
  namespace: production
  labels:
    app: feature-flags
    environment: production
spec:
  type: LoadBalancer
  selector:
    app: feature-flags
  ports:
  - name: http
    port: 443
    targetPort: http
    protocol: TCP

---
# Production Service - Blue (for blue-green deployment)
apiVersion: v1
kind: Service
metadata:
  name: feature-flags-blue
  namespace: production
  labels:
    app: feature-flags
    deployment: feature-flags-blue
spec:
  type: LoadBalancer
  selector:
    deployment: feature-flags-blue
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# PodDisruptionBudget (prevent disruptions during updates)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feature-flags
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: feature-flags

---
# Network Policy (security isolation)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: feature-flags
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: feature-flags
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53
